# MedSAM3-style SAM3 LoRA fine-tuning using C0-256-base pseudo labels.
# Training data = X3 pseudo manifest (623) from work/rerun_c0_256_base.
# Validation data = real Kvasir validation split for loss monitoring.
model:
  name: "facebook/sam3"
  checkpoint_path: /Data_8TB/lht/models/modelscope/models/facebook--sam3/snapshots/master/sam3.pt

lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
    - "qkv"
    - "proj"
    - "fc1"
    - "fc2"
    - "c_fc"
    - "c_proj"
    - "linear1"
    - "linear2"
  apply_to_vision_encoder: true
  apply_to_text_encoder: true
  apply_to_geometry_encoder: true
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true

training:
  data_dir: /Data_8TB/lht/PseudoVideo-SAM3-X3-B7/work/rerun_c0_256_base/medsam3_lora/data
  batch_size: 1
  num_workers: 2
  learning_rate: 5e-5
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  num_epochs: 20
  warmup_steps: 50
  lr_scheduler: "cosine"
  logging_steps: 10
  eval_steps: 999999
  save_steps: 999999
  save_total_limit: 20
  mixed_precision: "bf16"
  seed: 42
  gradient_accumulation_steps: 8

output:
  output_dir: "work/rerun_c0_256_base/medsam3_lora/lora_c0_256_x3"
  logging_dir: "logs"
  save_lora_only: true
  push_to_hub: false
  hub_model_id: null

evaluation:
  metric: "iou"
  save_predictions: false
  compute_metrics_during_training: true

hardware:
  device: "cuda"
  dataloader_pin_memory: true
  use_compile: false
