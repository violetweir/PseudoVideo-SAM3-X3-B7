# Full-module LoRA continuation of C0-256-base.
#
# Pseudo labels are selected by the frozen final C0-256-base rule:
# X3_best + B7, b3-b6, both route families, B7 >= 0.94.
# Training contains 494 pseudo labels plus the 8 fixed human GT anchors.
# The trainer follows the actual historical MedSAM3-LoRA behavior: batch 1,
# FP32, constant AdamW learning rate.  Every epoch is saved for downstream
# propagation evaluation; e50 is a training horizon, not a forced selection.

model:
  name: "facebook/sam3"
  checkpoint_path: /Data_8TB/lht/models/modelscope/models/facebook--sam3/snapshots/master/sam3.pt

lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
    - "qkv"
    - "proj"
    - "fc1"
    - "fc2"
    - "c_fc"
    - "c_proj"
    - "linear1"
    - "linear2"
  apply_to_vision_encoder: true
  apply_to_text_encoder: true
  apply_to_geometry_encoder: true
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true

training:
  data_dir: /Data_8TB/lht/PseudoVideo-SAM3-X3-B7/work/rerun_c0_256_base/medsam3_lora_b7_e50/data
  batch_size: 1
  num_workers: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  num_epochs: 50
  seed: 2026

output:
  output_dir: work/rerun_c0_256_base/medsam3_lora_b7_e50/lora_weights
  save_lora_only: true

evaluation:
  metric: "validation_loss"
  downstream_selection: "C0-256-base propagation + B7"

hardware:
  device: "cuda"
  training_resolution: 1008
